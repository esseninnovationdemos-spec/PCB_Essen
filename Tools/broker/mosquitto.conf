# Local development broker for the FactoryTwin Sparkplug B work.
#
# Anonymous access is enabled deliberately: this is a throwaway broker bound to
# the developer machine, standing in for the production broker at
# 192.168.100.102:31883 until that becomes available. Do NOT copy this config
# to anything reachable from outside localhost.

listener 1883
allow_anonymous true

# Persist retained messages / queued QoS>0 across restarts so Sparkplug session
# behaviour (bdSeq continuity, retained STATE) can be exercised realistically.
persistence true
persistence_location /mosquitto/data/

# Log to stdout so `docker compose logs -f` shows CONNECT/PUBLISH/will activity,
# which is how we verify the Last Will fires on an ungraceful disconnect.
log_dest stdout
log_type all
connection_messages true
