; --- External control -------------------------------------------------------
; Off by default: the line runs itself and the demo cannot be stopped by a PLC
; that is not there. Flip bExternalControlEnabled to hand sequencing over.
;
; PlcHostAddress is documentation only -- nothing dials the PLC. The connection
; is outbound from the EPIC to the broker, so the address the device needs is
; this workstation, configured on the device in groov Manage. Fill this in when
; the EPIC is on the network; a sweep of 192.168.250.0/24 on 2026-08-27 found
; no Opto 22 device answering.
bExternalControlEnabled=False
PlcEdgeNodeId=PLC01
PlcTimeoutSeconds=10.0
bFallBackToLocalOnPlcTimeout=True
PlcHostAddress=

; The GameFeatures plugin is pulled in by AllToolsets (via GameFeaturesToolset)
; and errors on startup if the asset manager has no rule for GameFeatureData.
; This project has no game feature plugins, so nothing is scanned -- the entry
; exists purely to satisfy that check. CookRule is set away from Unknown
; because the engine tests the rule against a default-constructed one, and an
; all-defaults entry reads as no entry at all.
[/Script/Engine.AssetManagerSettings]
