# ════════════════════════════════════════════════════════════════════════════
# factory_config.toml
#
#   Single source of truth for the SMT Line simulator.
#   Edit values here without touching any code.  Reloaded on each
#   factory_manager.init() call.
#
#   STRUCTURE
#     [broker]               – MQTT connection
#     [sparkplug]            – group_id / edge_node_id
#     [simulation]           – global defaults
#     [machines.<NAME>]      – one section per machine
#       .device_id           – Sparkplug B device name
#       .tick_interval_sec   – publish rate
#       .state_distribution  – % of time in each operating state
#       .metrics.<METRIC>    – nominal/absolute ranges + fault values
#       .degradation.*       – three independent degradation modes
# ════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# MQTT broker
# ─────────────────────────────────────────────────────────────────────────────
[broker]
host     = "192.168.100.102"
port     = 31883
username = ""
password = ""
keepalive_sec = 60
client_id     = "ue5_smt_simulator"

# ─────────────────────────────────────────────────────────────────────────────
# Sparkplug B topology
#   Topics produced:
#     spBv1.0/SMT_Line/NBIRTH/Cluj
#     spBv1.0/SMT_Line/DBIRTH/Cluj/<device_id>
#     spBv1.0/SMT_Line/DDATA/Cluj/<device_id>
#     spBv1.0/SMT_Line/DDEATH/Cluj/<device_id>
#     spBv1.0/SMT_Line/NDEATH/Cluj
# ─────────────────────────────────────────────────────────────────────────────
[sparkplug]
group_id     = "SMT_Line"
edge_node_id = "Cluj"
namespace    = "spBv1.0"

# ─────────────────────────────────────────────────────────────────────────────
# Global simulation defaults  (machines can override)
# ─────────────────────────────────────────────────────────────────────────────
[simulation]
tick_interval_sec    = 1.0        # default; overridden per machine
random_seed          = 0          # 0 = nondeterministic
publish_state_changes = true      # publish DDATA immediately on state change
log_level            = "INFO"     # DEBUG | INFO | WARN | ERROR

# State codes (matching the existing UNS legend)
#   0 = Idle / stopped
#   1 = Running
#   2 = FAULT
#   3 = Blocked / starved
#   4 = Warm-up
#   5 = Cool-down
#
# STATE TRANSITION GRAPH (implemented in sim_engine.py):
#   IDLE     → WARMUP    (start cycle)
#   WARMUP   → RUNNING   (deterministic when duration elapsed)
#   RUNNING  → BLOCKED   (transient starvation) | COOLDOWN | FAULT
#   BLOCKED  → RUNNING   (resource restored) | FAULT
#   COOLDOWN → IDLE      (deterministic when duration elapsed)
#   FAULT    → COOLDOWN  (recovery path back to idle)
#
# During WARMUP each metric interpolates from idle_value → nominal_mid
# (exponential shape for thermal metrics, linear for mechanical).
# During COOLDOWN it interpolates from the last-running value → idle_value.
# The per-machine [transitions] block sets ramp durations and shape.

# ═════════════════════════════════════════════════════════════════════════════
# CONVEYOR
#   Continuous high-frequency telemetry.  Real data had ~222k samples and a
#   negative-RPM data-quality defect; the simulator clamps to physical limits.
# ═════════════════════════════════════════════════════════════════════════════
[machines.CONVEYOR]
device_id          = "Conveyor"
enabled            = true
tick_interval_sec  = 0.2                                  # 5 Hz – matches real cadence
publish_on_event   = false                                # continuous, not cycle-based
carrier_ids        = ["CC_01","CC_02","CC_03","CC_04","CC_05","CC_06","CC_07","CC_08"]
carrier_dwell_sec  = 12                                   # avg time before next carrier appears

[machines.CONVEYOR.state_distribution]
RUNNING  = 0.92
IDLE     = 0.04
BLOCKED  = 0.03
FAULT    = 0.01

[machines.CONVEYOR.transitions]
# Conveyor motors reach steady RPM/temp in a few seconds; small thermal mass.
warmup_duration_sec   = 8
cooldown_duration_sec = 20
# Conveyor runs continuously — no fixed running_duration (cycles indefinitely)
ramp_shape            = "linear"   # linear | exponential
# Which metrics ramp during transitions. Others hold at idle_value in
# WARMUP/COOLDOWN. Thermal metrics benefit from exponential shape.
ramp_metrics          = ["belt_speed","rpm","torque","motor_temp"]
thermal_metrics       = ["motor_temp"]  # use exponential shape for these

[machines.CONVEYOR.metrics.belt_speed]
type        = "Float"
unit        = "m/min"
# Inline SMT conveyors typically run 0.5–20 m/min (slower than transport
# conveyors which can reach 60 m/min) – the slow speed gives accurate
# board hand-off between machines.  Source: SMT industry conveyor specs.
nominal     = [8.0, 18.0]
absolute    = [0.0, 25.0]
idle_value  = 0.0
fault_value = 0.0

[machines.CONVEYOR.metrics.motor_temp]
type        = "Float"
unit        = "C"
# Industrial servo motor: 40–80°C continuous, ~100–130°C thermal trip.
# A small 40–60 W SMT conveyor motor runs cooler than transport motors.
nominal     = [35.0, 65.0]
absolute    = [15.0, 105.0]
idle_value  = 22.0                                        # ambient
fault_value = 95.0                                        # typical thermal trip threshold

[machines.CONVEYOR.metrics.rpm]
type        = "Float"
unit        = "RPM"
nominal     = [1800.0, 3500.0]
absolute    = [0.0, 4500.0]                               # FIXED: no negative RPMs
idle_value  = 0.0
fault_value = 0.0

[machines.CONVEYOR.metrics.torque]
type        = "Float"
unit        = "raw"
nominal     = [240.0, 320.0]
absolute    = [0.0, 450.0]
idle_value  = 5.0
fault_value = 420.0                                       # stall torque

[machines.CONVEYOR.degradation.fluctuating]
enabled        = false
noise_pct      = 0.04                                     # ±4% gaussian noise
applies_to     = ["motor_temp","rpm","torque"]

[machines.CONVEYOR.degradation.drift]
enabled            = false
metric             = "motor_temp"                         # bearing wear → heat creep
rate_per_hour      = 0.4                                  # °C / hr
max_drift          = 18.0
reset_on_idle      = false

[machines.CONVEYOR.degradation.spike]
enabled                  = false
mean_minutes_between     = 45
duration_sec             = 8
metrics                  = ["motor_temp","torque"]
spike_to                 = "fault_value"                  # or "absolute_max" / "absolute_min"
forces_state             = "FAULT"

# ═════════════════════════════════════════════════════════════════════════════
# COMPONENT_PLACER
#   High-rate motion telemetry (pick-and-place head).
# ═════════════════════════════════════════════════════════════════════════════
[machines.COMPONENT_PLACER]
device_id          = "COMPONENT_PLACER"
enabled            = true
tick_interval_sec  = 0.25
publish_on_event   = false

[machines.COMPONENT_PLACER.state_distribution]
RUNNING  = 0.88
IDLE     = 0.06
BLOCKED  = 0.04
FAULT    = 0.02

[machines.COMPONENT_PLACER.transitions]
# Placer homing + calibration ramp. RUNNING exits only on CYCLE_COMPLETE.
warmup_duration_sec   = 8
cooldown_duration_sec = 6
ramp_shape            = "linear"
ramp_metrics          = ["arm_pos_x","arm_pos_y","arm_pos_z"]

[machines.COMPONENT_PLACER.metrics.arm_pos_x]
type        = "Float"
unit        = "mm"
# Modern mid-range SMT placers have a working envelope of ~350–500mm × 250–400mm.
# Mycronic MY300 series and Yamaha YSM10 have similar ranges.
nominal     = [40.0, 380.0]                               # full board sweep
absolute    = [0.0, 460.0]
idle_value  = 0.0                                         # parked left
fault_value = 0.0
motion_profile = "sine"                                   # smooth sinusoidal sweep

[machines.COMPONENT_PLACER.metrics.arm_pos_y]
type        = "Float"
unit        = "mm"
nominal     = [30.0, 290.0]
absolute    = [0.0, 340.0]
idle_value  = 0.0                                         # parked front
fault_value = 0.0
motion_profile = "sine"

[machines.COMPONENT_PLACER.metrics.arm_pos_z]
type        = "Float"
unit        = "mm"
# Z is the head hover height above the board.  Pick = dip to ~88mm,
# travel = hover at ~95mm.  Full Z travel range is typically 0–30mm of stroke
# but the head position remains in the 85–100mm range relative to board.
nominal     = [88.0, 96.0]
absolute    = [82.0, 102.0]
idle_value  = 95.0                                        # parked at hover
fault_value = 95.0
motion_profile = "sawtooth"                               # pick → dwell → lift

[machines.COMPONENT_PLACER.metrics.cycle_time]
type        = "Float"
unit        = "s"
# Per-component placement cycle.  Modern multi-head placers: 0.06–0.2s for
# chip components (chip shooters), 0.3–0.6s general, 1–2s for QFP/large.
# Capturing 1.0–4.0s suggests a moderate-speed mixed-component machine.
nominal     = [0.4, 2.5]
absolute    = [0.05, 6.0]
idle_value  = 0.0
fault_value = 0.0
publish_on  = "cycle_complete"                            # only on CYCLE_COMPLETE event

[machines.COMPONENT_PLACER.degradation.fluctuating]
enabled    = false
noise_pct  = 0.03
applies_to = ["arm_pos_x","arm_pos_y","arm_pos_z"]

[machines.COMPONENT_PLACER.degradation.drift]
enabled       = false
metric        = "cycle_time"                              # slowing down over time
rate_per_hour = 0.05                                      # +50 ms / hr
max_drift     = 1.5

[machines.COMPONENT_PLACER.degradation.spike]
enabled              = false
mean_minutes_between = 60
duration_sec         = 3
metrics              = ["arm_pos_x","arm_pos_y"]          # position jitter / miss
spike_to             = "absolute_max"
forces_state         = "FAULT"

# ═════════════════════════════════════════════════════════════════════════════
# REFLOW_OVEN
#   Cycle-based.  Healthy ~246°C, over-temp fault peaks ~283°C.
# ═════════════════════════════════════════════════════════════════════════════
[machines.REFLOW_OVEN]
device_id          = "REFLOW_OVEN"
enabled            = true
tick_interval_sec  = 1.0
publish_on_event   = true                                 # cycle-based machine

[machines.REFLOW_OVEN.state_distribution]
RUNNING  = 0.94
IDLE     = 0.03
BLOCKED  = 0.02
FAULT    = 0.01

[machines.REFLOW_OVEN.transitions]
# Scaled for demo. RUNNING exits only on CYCLE_COMPLETE.
warmup_duration_sec   = 12      # ramp 30 → 245 C (demo-speed)
cooldown_duration_sec = 10      # ramp back to 30 C (demo-speed)
ramp_shape            = "exponential"
ramp_metrics          = ["oven_temp_c","cooling_temp_c"]
thermal_metrics       = ["oven_temp_c","cooling_temp_c"]

[machines.REFLOW_OVEN.metrics.oven_temp_c]
type        = "Float"
unit        = "C"
# SAC305 lead-free solder (industry standard since RoHS) melts at ~217°C,
# requires peak reflow of 235–250°C for 20–30 sec.  Sources: AIM Solder
# spec, JLCPCB, IPC profile guides.  Time above liquidus 30–90 sec.
nominal     = [235.0, 248.0]                              # SAC305 peak band
# Absolute physical range includes cold-off state; 285 = high alarm ceiling.
absolute    = [20.0, 285.0]
idle_value  = 30.0                                        # cools to near ambient
fault_value = 283.0                                       # over-temp excursion
warmup_value = 200.0

[machines.REFLOW_OVEN.metrics.cooling_temp_c]
type        = "Float"
unit        = "C"
# Cooling zone exit temp.  Cooling rate 3–10°C/sec brings PCB from ~245°C
# to below solder solidus rapidly to form fine-grain joints.
nominal     = [40.0, 50.0]
absolute    = [25.0, 70.0]
idle_value  = 25.0
fault_value = 65.0                                        # cooler failure

[machines.REFLOW_OVEN.metrics.cycle_time_sec]
type        = "Float"
unit        = "s"
nominal     = [175.0, 185.0]                              # ~180s line bottleneck
absolute    = [160.0, 220.0]
idle_value  = 0.0
fault_value = 0.0
publish_on  = "cycle_complete"

[machines.REFLOW_OVEN.degradation.fluctuating]
enabled    = false
noise_pct  = 0.015                                        # ovens are very stable
applies_to = ["oven_temp_c","cooling_temp_c"]

[machines.REFLOW_OVEN.degradation.drift]
enabled       = false
metric        = "oven_temp_c"                             # heater element ageing
rate_per_hour = 0.8                                       # °C / hr upward
max_drift     = 35.0                                      # → triggers over-temp fault

[machines.REFLOW_OVEN.degradation.spike]
enabled              = false
mean_minutes_between = 120
duration_sec         = 15
metrics              = ["oven_temp_c"]
spike_to             = "fault_value"
forces_state         = "FAULT"

# ═════════════════════════════════════════════════════════════════════════════
# LASER_MARKING
#   Cycle-based.  Healthy ~46°C, fault excursion ~101°C.  Has WARMUP state.
# ═════════════════════════════════════════════════════════════════════════════
[machines.LASER_MARKING]
device_id          = "LASER_MARKING"
enabled            = true
tick_interval_sec  = 0.5
publish_on_event   = true
part_ids           = ["ACC-Inno-1","ACC-Inno-2","ACC-Inno-3","ACC-Inno-4","ACC-Inno-5","ABC-FG"]

[machines.LASER_MARKING.state_distribution]
RUNNING  = 0.85
IDLE     = 0.05
BLOCKED  = 0.04
WARMUP   = 0.04
FAULT    = 0.02

[machines.LASER_MARKING.transitions]
# Fiber laser diode warm-up. RUNNING exits only on CYCLE_COMPLETE.
warmup_duration_sec   = 8
cooldown_duration_sec = 6
ramp_shape            = "exponential"
ramp_metrics          = ["laser_temp_c","laser_power_pct","fume_extractor_rpm"]
thermal_metrics       = ["laser_temp_c"]

[machines.LASER_MARKING.metrics.laser_temp_c]
type        = "Float"
unit        = "C"
# This is the laser CABINET/enclosure temperature (air-cooled fiber laser
# markers, common for SMT marking, 20–50W typical power).
# Water-chilled industrial lasers hold their resonator at 25°C ±0.5 via
# the chiller – that's a different metric not modelled here.
nominal     = [38.0, 52.0]
absolute    = [20.0, 110.0]
idle_value  = 28.0
warmup_value = 40.0
fault_value = 101.0                                       # over-temp fault observed

[machines.LASER_MARKING.metrics.laser_power_pct]
type        = "Float"
unit        = "%"
# Fiber laser markers run 60–80% power for engraving, 80–100% for deep
# marking / cutting.  Typical SMT board marking uses 50–85% power.
nominal     = [55.0, 90.0]
absolute    = [0.0, 100.0]
idle_value  = 0.0
warmup_value = 20.0
fault_value = 0.0                                         # interlock cuts power

[machines.LASER_MARKING.metrics.fume_extractor_rpm]
type        = "Float"
unit        = "RPM"
nominal     = [2800.0, 3300.0]
absolute    = [0.0, 3500.0]
idle_value  = 0.0
warmup_value = 1500.0
fault_value = 3500.0                                      # spins to max on alarm

[machines.LASER_MARKING.metrics.cycle_time_sec]
type        = "Float"
unit        = "s"
nominal     = [12.0, 17.0]
absolute    = [10.0, 25.0]
idle_value  = 0.0
fault_value = 0.0
publish_on  = "cycle_complete"

[machines.LASER_MARKING.degradation.fluctuating]
enabled    = false
noise_pct  = 0.05
applies_to = ["laser_temp_c","laser_power_pct"]

[machines.LASER_MARKING.degradation.drift]
enabled       = false
metric        = "laser_temp_c"                            # cooling system degradation
rate_per_hour = 1.2
max_drift     = 50.0                                      # → drives toward 101°C fault

[machines.LASER_MARKING.degradation.spike]
enabled              = false
mean_minutes_between = 90
duration_sec         = 6
metrics              = ["laser_temp_c","fume_extractor_rpm"]
spike_to             = "fault_value"
forces_state         = "FAULT"

# ═════════════════════════════════════════════════════════════════════════════
# AUTO_OPTICALINSP (AOI)
#   Cycle-based inspection.  PASS/FAIL verdict per board.
# ═════════════════════════════════════════════════════════════════════════════
[machines.AUTO_OPTICALINSP]
device_id          = "AUTO_OPTICALINSP"
enabled            = true
tick_interval_sec  = 0.5
publish_on_event   = true
# Healthy SMT lines: 1–5% AOI fail rate (95–99% pass).  World-class: <1%.
fail_rate          = 0.02

[machines.AUTO_OPTICALINSP.state_distribution]
RUNNING  = 0.93
IDLE     = 0.04
BLOCKED  = 0.02
FAULT    = 0.01

[machines.AUTO_OPTICALINSP.transitions]
# AOI LED/camera stabilisation. RUNNING exits only on CYCLE_COMPLETE.
warmup_duration_sec   = 5
cooldown_duration_sec = 4
ramp_shape            = "linear"
ramp_metrics          = ["solder_quality_score"]

[machines.AUTO_OPTICALINSP.metrics.comp_position_offset_mm]
type        = "Float"
unit        = "mm"
nominal     = [0.0, 0.3]                                  # tight when healthy
absolute    = [0.0, 1.0]
idle_value  = 0.0
fault_value = 0.85                                        # large offset = misplace

[machines.AUTO_OPTICALINSP.metrics.solder_quality_score]
type        = "Float"
unit        = "0-100"
nominal     = [91.0, 96.0]
absolute    = [0.0, 100.0]   # 0 covers idle/off; 70 was the alarm floor
idle_value  = 0.0
fault_value = 75.0                                        # poor solder

[machines.AUTO_OPTICALINSP.metrics.cycle_time_sec]
type        = "Float"
unit        = "s"
nominal     = [2.0, 3.0]
absolute    = [1.5, 5.0]
idle_value  = 0.0
fault_value = 0.0
publish_on  = "cycle_complete"

[machines.AUTO_OPTICALINSP.degradation.fluctuating]
enabled    = false
noise_pct  = 0.08                                         # vision noise is real
applies_to = ["solder_quality_score","comp_position_offset_mm"]

[machines.AUTO_OPTICALINSP.degradation.drift]
enabled       = false
metric        = "solder_quality_score"                    # process drift → quality erosion
rate_per_hour = -0.4                                      # negative = downward
max_drift     = -15.0
linked_failure = true                                     # drives fail_rate upward

[machines.AUTO_OPTICALINSP.degradation.spike]
enabled              = false
mean_minutes_between = 30
duration_sec         = 4
metrics              = ["comp_position_offset_mm"]
spike_to             = "fault_value"
forces_state         = "FAULT"

# ═════════════════════════════════════════════════════════════════════════════
# SOLDER_INSP (SPI)
#   Cycle-based paste inspection.
# ═════════════════════════════════════════════════════════════════════════════
[machines.SOLDER_INSP]
device_id          = "SOLDER_INSP"
enabled            = true
tick_interval_sec  = 0.5
publish_on_event   = true
fail_rate          = 0.02

[machines.SOLDER_INSP.state_distribution]
RUNNING  = 0.94
IDLE     = 0.04
BLOCKED  = 0.01
FAULT    = 0.01

[machines.SOLDER_INSP.transitions]
# RUNNING exits only on CYCLE_COMPLETE.
warmup_duration_sec   = 5
cooldown_duration_sec = 4
ramp_shape            = "linear"
ramp_metrics          = ["area","volume"]

[machines.SOLDER_INSP.metrics.area]
type        = "Float"
unit        = "mm2"
nominal     = [84.0, 86.0]
absolute    = [0.0, 95.0]   # 0 covers idle; 75 was the low alarm
idle_value  = 0.0
fault_value = 78.0                                        # insufficient paste

[machines.SOLDER_INSP.metrics.volume]
type        = "Float"
unit        = "raw"
nominal     = [8.0, 13.0]
absolute    = [0.0, 20.0]   # 0 covers idle; 4 was the low alarm
idle_value  = 0.0
fault_value = 5.0                                         # low volume = bridging risk

[machines.SOLDER_INSP.metrics.cycle_time_sec]
type        = "Float"
unit        = "s"
nominal     = [2.0, 3.0]
absolute    = [1.5, 5.0]
idle_value  = 0.0
fault_value = 0.0
publish_on  = "cycle_complete"

[machines.SOLDER_INSP.degradation.fluctuating]
enabled    = false
noise_pct  = 0.04
applies_to = ["area","volume"]

[machines.SOLDER_INSP.degradation.drift]
enabled       = false
metric        = "volume"                                  # squeegee wear → less paste
rate_per_hour = -0.05
max_drift     = -3.0

[machines.SOLDER_INSP.degradation.spike]
enabled              = false
mean_minutes_between = 50
duration_sec         = 3
metrics              = ["area","volume"]
spike_to             = "fault_value"
forces_state         = "FAULT"

# ═════════════════════════════════════════════════════════════════════════════
# LINE (aggregator – publishes whole-line takt only)
#   Driven by REFLOW_OVEN cycle (the bottleneck).
# ═════════════════════════════════════════════════════════════════════════════
[machines.LINE]
device_id          = "SMT_LINE"
enabled            = true
tick_interval_sec  = 0.0                                  # 0 = skipped by auto-tick; publishes only on explicit CYCLE_COMPLETE
publish_on_event   = true

[machines.LINE.state_distribution]
RUNNING  = 1.0                                            # mirrors bottleneck state

[machines.LINE.transitions]
warmup_duration_sec   = 2
cooldown_duration_sec = 5

[machines.LINE.metrics.cycle_time]
type        = "Float"
unit        = "s"
nominal     = [125.0, 195.0]                              # whole-line takt
absolute    = [100.0, 240.0]
idle_value  = 0.0
fault_value = 0.0
publish_on  = "cycle_complete"

# Line has no independent degradation – it reflects machine states
[machines.LINE.degradation.fluctuating]
enabled = false
[machines.LINE.degradation.drift]
enabled = false
[machines.LINE.degradation.spike]
enabled = false